<!doctype html>
<html lang="en">
  <head>
    <!-- Core -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <title>Social Downloader: One Bar for YouTube, Instagram, Pinterest</title>
    <link rel="canonical" href="https://social-downloader.vercel.app/" />

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Paste any YouTube, Instagram or Pinterest link and pull the original media in seconds. No signup, no watermarks, no limits."
    />
    <meta
      name="keywords"
      content="social downloader, youtube downloader, instagram downloader, pinterest downloader, video downloader, reels downloader, media downloader, no watermark downloader"
    />
    <meta name="author" content="Social Downloader" />
    <meta name="application-name" content="Social Downloader" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="rating" content="general" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://social-downloader.vercel.app/" />
    <meta property="og:site_name" content="Social Downloader" />
    <meta property="og:title" content="Social Downloader: One Bar for YouTube, Instagram, Pinterest" />
    <meta
      property="og:description"
      content="One input bar. YouTube, Instagram and Pinterest media resolved instantly, no signup, no watermarks."
    />
    <meta property="og:image" content="https://anya-file-host.vercel.app/nkzvmo9xxg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Social Downloader app preview" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Social Downloader: One Bar for YouTube, Instagram, Pinterest" />
    <meta
      name="twitter:description"
      content="Paste any YouTube, Instagram or Pinterest link and pull the original media in seconds."
    />
    <meta name="twitter:image" content="https://anya-file-host.vercel.app/nkzvmo9xxg" />
    <meta name="twitter:image:alt" content="Social Downloader app preview" />

    <!-- PWA / mobile app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Social Downloader" />
    <meta name="msapplication-TileColor" content="#07080c" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/favicon.png" />
    <meta name="msapplication-config" content="none" />

    <!-- Icons / manifest -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.jpg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Social Downloader",
        "url": "https://social-downloader.vercel.app/",
        "description": "Paste any YouTube, Instagram or Pinterest link and pull the original media in seconds. No signup, no watermarks, no limits.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <noscript>Social Downloader needs JavaScript enabled.</noscript>
    <div id="root"></div>
  </body>
</html>
